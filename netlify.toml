[build]
  publish = "."

# This package is already-built static output (no package.json / source
# included), so there is no build command to run — Netlify just serves
# these files directly from the repo root.
#
# Clean URLs are handled automatically by Netlify's static file server, so
# no custom redirects are needed for the pages that still exist in this site.

# Both library pages have been archived (removed from this package, kept
# only in the internal working copy) — Discover is now the only browsing
# destination, with its own search, format filters (Print/Audio/Video), and
# inline reader covering what those pages used to be for. The old map +
# region-based browser widget was dropped outright: it depended on a
# compiled bundle whose region-matching turned out unreliable for the
# current (larger, more obscure-language-heavy) catalog — verified by it
# visibly failing to filter the list when clicked. These redirects exist
# purely so old bookmarks/links/search results don't 404 — there is no page
# left at either path for Netlify to serve instead.
[[redirects]]
  from = "/create/library/*"
  to = "/discover/"
  status = 301
  force = true

[[redirects]]
  from = "/library/*"
  to = "/discover/"
  status = 301
  force = true

# Images are effectively static under their current filenames — long,
# immutable caching is safe for these.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS and CSS are actively edited under these SAME filenames (no
# content-hashed filenames here, since this is a plain static build with no
# bundler step). An "immutable" 1-year cache on these was a real bug: once a
# visitor's browser cached the old resources.js, "immutable" told it never to
# even check the server again — so a fix shipped in a later deploy could
# silently never reach anyone who had already visited the site, no matter how
# many times they reloaded. "no-cache" here means "always revalidate with the
# server before using the cached copy" (a fast 304 when unchanged, the new
# file immediately when it isn't) — not "don't cache".
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, no-cache"
